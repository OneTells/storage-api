[project]
name = "storage-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "aiogram[fast]>=3.27.0",
    "aiohttp-socks>=0.11.0",
    "asyncpg>=0.31.0",
    "everbase",
    "fastapi>=0.136.1",
    "gunicorn>=25.3.0",
    "loguru>=0.7.3",
    "orjson>=3.11.8",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.0",
    "sqlalchemy>=2.0.49",
    "starlette>=1.0.0",
    "uvicorn>=0.46.0",
    "uvloop>=0.21.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pyrefly>=0.45.0",
]

[tool.uv.sources]
everbase = { git = "https://github.com/OneTells/everbase", tag = "3.0.3" }
